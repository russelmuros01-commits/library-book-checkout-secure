<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Users - Library System</title>

    <link rel="stylesheet" href="../style.css">

</head>

<body>

    <!-- ========================================
         LOGIN CHECK
         ======================================== -->

    <script src="../js/security.js" data-guard data-roles="Librarian,Admin"></script>


    <!-- ========================================
         HEADER
         ======================================== -->

    <header>

        <div class="header-content">

            <h1>
                Library Book Checkout System
            </h1>

            <p>
                User Management
            </p>

        </div>

    </header>


    <!-- ========================================
         NAVIGATION
         ======================================== -->

    <nav>

        <a href="../index.html">
            Dashboard
        </a>

        <a href="books.html">
            Books
        </a>

        <a href="checkout.html">
            Checkout
        </a>

        <a href="return.html">
            Return
        </a>

        <a href="users.html" class="active">
            Users
        </a>

        <button
            type="button"
            id="logoutButton">
            Logout
        </button>

    </nav>


    <!-- ========================================
         MAIN CONTENT
         ======================================== -->

    <main class="container">

        <section class="welcome">

            <h2>
                Library Users
            </h2>

            <p>
                View registered library users.
            </p>

        </section>


        <!-- ========================================
             USER TABLE
             ======================================== -->

        <section class="dashboard-section">

            <table>

                <thead>

                    <tr>

                        <th>
                            User ID
                        </th>

                        <th>
                            Name
                        </th>

                        <th>
                            Email
                        </th>

                        <th>
                            Role
                        </th>

                    </tr>

                </thead>


                <tbody id="userTable">

                </tbody>

            </table>

        </section>

    </main>


    <!-- ========================================
         FOOTER
         ======================================== -->

    <footer>

        <p>
            Library Book Checkout System &copy; 2026
        </p>

    </footer>


    <!-- ========================================
         USERS JAVASCRIPT
         ======================================== -->

    <script src="../js/users.js"></script>

</body>

</html>
