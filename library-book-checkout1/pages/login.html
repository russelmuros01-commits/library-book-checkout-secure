<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Library Book Checkout System</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <header>
        <div class="header-content">
            <h1>Library Book Checkout System</h1>
            <p>Simple Library Management System</p>
        </div>
    </header>


    <main class="container">

        <section class="login-section">

            <div class="login-card">

                <h2>Login</h2>

                <p class="login-description">
                    Sign in to access the Library Book Checkout System.
                </p>


                <form id="loginForm">

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            maxlength="254"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            maxlength="128"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <div id="loginMessage" class="login-message" role="alert"></div>

                    <button type="submit" class="login-button">
                        Login
                    </button>

                    <p class="login-description" style="margin-top: 20px; margin-bottom: 0;">
                        <a href="forgot-password.html">Forgot your password?</a>
                    </p>

                    <p class="login-description" style="margin-top: 10px; margin-bottom: 0;">
                        Don't have an account?
                        <a href="register.html">Create an account</a>
                    </p>

                </form>

            </div>

        </section>

    </main>


    <footer>
        <p>Library Book Checkout System &copy; 2026</p>
    </footer>


    <script src="../js/security.js"></script>
    <script src="../js/login.js"></script>

</body>

</html>
